version: '3.8'

services:
  # 1. The Database (The Warehouse)
  mongodb:
    image: mongo:latest
    container_name: sec_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db

  # 2. The Visual Dashboard (The Eye)
  mongo-express:
    image: mongo-express:latest
    container_name: sec_ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017/
      - ME_CONFIG_BASICAUTH=false 
    depends_on:
      - mongodb

  # 3. Your Python Scraper (The Engine)
  app:
    build: .
    container_name: sec_scraper
    working_dir: /app
    command: python scraper.py
    env_file:
      - .env
    environment:
      # We explicitly pass the authenticated URI to your Python script here!
      - MONGO_URI=mongodb://admin:password@mongodb:27017/
    depends_on:
      - mongodb
    volumes:
      - .:/app 

volumes:
  mongodb_data: